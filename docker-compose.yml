services:
  database:
    image: postgis/postgis:16-3.4
    container_name: darukaa-postgis
    environment:
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa
      POSTGRES_DB: darukaa
    ports:
      - '5432:5432'
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darukaa -d darukaa']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis_data:
