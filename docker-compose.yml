services:
  database:
    image: postgis/postgis:16-3.4
    container_name: geo-atlas-postgis
    environment:
      POSTGRES_USER: geoatlas
      POSTGRES_PASSWORD: geoatlas
      POSTGRES_DB: geoatlas
    ports:
      - '5432:5432'
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U geoatlas -d geoatlas']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis_data:
