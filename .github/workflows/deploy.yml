name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  API_URL: https://geo-atlas-api.vercel.app
  WEB_URL: https://geo-atlas-web.vercel.app

jobs:
  migrate:
    name: Migrate and seed the database
    runs-on: ubuntu-latest
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --group dev
      - name: Upgrade schema to head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: uv run --no-sync alembic upgrade head
      - name: Seed the demo portfolio
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: uv run --no-sync python -m src.cli.seed_demo

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: migrate
    defaults:
      run:
        working-directory: backend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-web:
    name: Deploy web app
    runs-on: ubuntu-latest
    needs: deploy-api
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  smoke-test:
    name: Smoke test production
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - name: API is up and connected to PostGIS
        run: |
          body=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 "$API_URL/health")
          echo "$body"
          echo "$body" | grep -q '"database":"connected"'
      - name: Website serves the app
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$WEB_URL/login" | grep -q '<title>Darukaa.Earth'
