[project]
name = "darukaa-earth-api"
version = "1.0.0"
description = "Geospatial analytics API for carbon and biodiversity projects"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy>=2.0.36,<2.1",
    "geoalchemy2>=0.16,<0.17",
    "psycopg2-binary>=2.9.10,<3.0",
    "bcrypt>=4.2,<5.0",
    "pyjwt>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "alembic>=1.14,<2.0",
    "uvicorn[standard]>=0.34,<0.35",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<0.29",
    "ruff>=0.8,<0.9",
    "mypy>=1.14,<2.0",
]

[tool.uv]
package = false
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "ARG", "PTH", "TID"]
ignore = ["B008"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
